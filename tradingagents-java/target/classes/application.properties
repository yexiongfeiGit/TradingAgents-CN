spring.application.name=TradingAgents-CN
server.port=8080
server.servlet.context-path=/

# 日志配置
logging.level.root=INFO
logging.level.com.tradingagents=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/tradingagents.log

# 外部API配置
api.openai.base-url=https://api.openai.com
api.openai.timeout=30
api.openai.max-retries=3
api.openai.retry-delay=1000

# 数据缓存配置
cache.ttl-minutes=15
cache.max-size=1000
cache.auto-refresh=true
cache.refresh-interval-minutes=5

# 智能体配置
agents.max-concurrent-analyses=10
agents.debate-rounds=3
agents.max-tokens=4096
agents.temperature=0.7
agents.timeout-seconds=60
agents.retry-attempts=2
agents.retry-delay-seconds=3

# 工作流配置
workflow.max-steps=20
workflow.timeout-minutes=30
workflow.retry-attempts=3
workflow.retry-delay-seconds=5
workflow.parallel-execution=true
workflow.step-timeout-seconds=300

# 市场数据配置
market-data.auto-refresh=true
market-data.refresh-interval-minutes=5
market-data.supported-exchanges=NYSE,NASDAQ,HKEX,SSE,SZSE
market-data.hours.nyse.open=09:30
market-data.hours.nyse.close=16:00
market-data.hours.nyse.timezone=EST
market-data.hours.sse.open=09:30
market-data.hours.sse.close=15:00
market-data.hours.sse.timezone=CST

# 风险管理配置
risk.max-position-size=0.1
risk.stop-loss-percentage=0.05
risk.take-profit-percentage=0.15
risk.max-portfolio-risk=0.2
risk.var-confidence-level=0.95

# 投资组合配置
portfolio.max-positions=20
portfolio.rebalance-frequency=daily
portfolio.min-investment-amount=1000
portfolio.diversification-threshold=0.1

# 安全配置
security.cors-enabled=true
security.rate-limit-enabled=true
security.rate-limit-per-minute=100
security.api-key-required=false